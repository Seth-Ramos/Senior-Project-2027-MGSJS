<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A website starter page">
  <title>senior project</title>
  <style>
    /* CSS: add your styles here */
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #17211d;
      background: #F4F2E1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

header {
 padding-block: 1.25rem;
  background-color: #DFD089;
  color: black;
}

.site-logo {
  width: 150px;
  height: auto;
}

.header-content {
  width: min(100% - 2rem, 960px);
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.header-text {
  text-align: center;
}

.header-actions {
  display: flex;
  gap: 0.5rem;
}

  
    main,
    footer {
      width: min(100% - 2rem, 960px);
      margin-inline: auto;
    }

    footer {
      padding-block: 1.25rem;
    }

    main {
      padding-block: 4rem;
    }

    button {
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 4px;
      color: white;
      background: #176b54;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #10513f;
    }
  </style>
</head>
<body>
  <header>
  <div class="header-content">
    <img class="site-logo" src="images/counseling_logo.png" alt="Schurr High Counseling logo">

    <div class="header-text">
      <h1>Schurr High Counseling</h1>
      <h2>Student Guidance & Support Portal</h2>
    </div>

    <div class="header-actions">
      <button type="button">About</button>
      <button type="button">Contact</button>
    </div>
  </div>
</header>

  <main>
    <h1>Senior Counseling Website Project</h1>
    <p>Pop up calender for scheduling appointments with counselors.</p>
    <button id="hello-button" type="button">Schedule Appointment</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <footer>
    <small>&copy; <span id="year"></span> MGSJS Senior Project</small>
  </footer>

  <script>
    // JavaScript: add your behavior here
    document.querySelector("#year").textContent = new Date().getFullYear();

    document.querySelector("#hello-button").addEventListener("click", () => {
      document.querySelector("#message").textContent = "Appointment scheduling popup will appear here.";
    });
  </script>
</body>
</html>
